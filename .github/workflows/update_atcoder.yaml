name: Update Atcoder Ratings

on:
    schedule:
        - cron: '0 0 * * 1' # UTC Time, +8 is SGT, so 8:00 am SGT
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update_atcoder:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 22
                cache: npm
            
            - name: Install dependencies
              run: npm ci

            - name: Update AtCoder ratings
              run: npm run update:atcoder

            - name: Commit updated ratings
              run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                    git add public/data/atcoder-ratings.json

                    if git diff --cached --quiet; then
                        echo "No AtCoder rating changes"
                        exit 0
                    fi

                    git commit -m "chore: update AtCoder ratings at $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M SGT')"
                    git push

